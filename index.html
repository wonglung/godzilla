<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176353">
  <title>報修登記</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main>
    <header class="page-header"><span class="eyebrow">REPAIR DESK</span><h1>報修登記</h1><p>記下問題，讓每一件報修都有跡可循。</p></header>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <p class="hint">所有欄位皆必填。此為公開示範，請使用虛構姓名與地點，勿填寫敏感資訊。</p>
      <form id="repair-form">
        <fieldset id="form-fields">
          <div class="grid">
            <label>報修人<input name="reporter_name" required maxlength="100" placeholder="例如：林小晴（虛構）" autocomplete="off"></label>
            <label>地點或部門<input name="location" required maxlength="200" placeholder="例如：星河示範樓／行政部（虛構）" autocomplete="off"></label>
            <label>類別<select name="category" required><option value="">請選擇類別</option><option>設備</option><option>網路</option><option>環境</option><option>其他</option></select></label>
            <label>緊急程度<select name="urgency" required><option>低</option><option selected>中</option><option>高</option></select></label>
          </div>
          <label>問題說明<textarea name="description" required maxlength="2000" rows="4" placeholder="請描述發生的問題與位置（限虛構內容）"></textarea></label>
          <button id="submit-button" type="submit">送出報修</button>
        </fieldset>
      </form>
      <p id="form-message" class="message" role="status" aria-live="polite"></p>
    </section>
    <section class="panel" aria-labelledby="list-title">
      <div class="section-heading"><div><h2 id="list-title">最近報修</h2><p class="hint">最近 20 筆，依登記時間由新到舊</p></div><button id="refresh-button" type="button" class="secondary">重新整理</button></div>
      <p id="list-message" class="message" role="status" aria-live="polite"></p>
      <div id="request-list" class="request-list" aria-busy="false"></div>
    </section>
    <footer>報修登記 · 示範系統</footer>
  </main>
</body>
</html>
